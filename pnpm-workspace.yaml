allowBuilds:
  '@tailwindcss/oxide': true
  esbuild: true
  lefthook: true
  sharp: true
  unrs-resolver: true

catalog:
  '@testing-library/dom': 10.4.2
  '@testing-library/jest-dom': 7.0.1
  '@testing-library/react': 16.3.3
  '@types/react': 19.3.0
  '@types/react-dom': 19.3.0
  '@vitejs/plugin-react': 6.2.1
  '@williamthorsen/eslint-config-typescript': 20.2.0
  '@williamthorsen/nmr': 0.55.0
  dotenv: 18.0.9
  eslint: 10.14.0
  eslint-plugin-react: 7.37.5
  happy-dom: 21.0.4
  react: 19.3.1
  react-dom: 19.3.1
  vite: 8.3.6
  vitest: 5.1.0

# Keep pnpm 11's 24h minimumReleaseAge soak (supply-chain protection), set explicitly to pin the policy, but exclude
# first-party packages so that a freshly published version can be consumed downstream without waiting out the soak.
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - '@williamthorsen/*'
  - codeassembly
  - codeassembly-lifecycle
  - readyup
  - v11y-check

packages:
  - apps/*
  - packages/*

peerDependencyRules:
  allowedVersions:
    'eslint-plugin-react>eslint': '>=10'

savePrefix: ''

# Refuse a release whose provenance is weaker than that of an earlier release of the same package,
# which can signal a compromised publisher.
trustPolicy: no-downgrade
trustPolicyExclude:
  # The 6.x backport of the ReDoS fix, published by an npm CLI maintainer without provenance after 7.x gained it;
  # `@babel/core` and `eslint-plugin-react` require `^6`.
  - semver@6.3.1
